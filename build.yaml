# Hojicha44 CI build matrix: one firmware per half (left = central).
# Board is the ZMK upstream nice!nano v2, classic name. (The //zmk
# variant syntax belongs to post-v0.3 trees; this repo pins v0.3, where
# plain nice_nano_v2 configures and compiles — proven by CI. The @main
# workflow's compat diagnostic is satisfied via CONFIG_ZMK_BOARD_COMPAT
# in config/hojicha44.conf instead.)
# Shared keymap (config/hojicha44.keymap) serves both shields, Corne-style.
---

include:
  - board: nice_nano_v2
    shield: hojicha44_left
  - board: nice_nano_v2
    shield: hojicha44_right

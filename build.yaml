# Hojicha44 CI build matrix: one firmware per half (left = central).
# Board is the ZMK upstream nice!nano v2, classic name, and the reusable
# workflow is pinned to the same v0.3 vintage as west.yml (matched pair —
# the @main workflow carries a compat diagnostic this tree predates).
# Shared keymap (config/hojicha44.keymap) serves both shields, Corne-style.
---

include:
  - board: nice_nano_v2
    shield: hojicha44_left
  - board: nice_nano_v2
    shield: hojicha44_right

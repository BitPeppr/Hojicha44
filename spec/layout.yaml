# Layout-phase specification (frozen v2 baseline).
# Source of truth for geometry is layout/ergogen/config.yaml;
# this file records the keymap and decisions around it.
# Statuses: fixed | provisional | candidate | measured | undecided.

version: 0.9.2
status: provisional  # geometry agreed + PCB envelope added, awaiting print-test

key_count:
  total: 44
  per_side: 22
  matrix: 18        # 6 columns x 3 rows, MX 19 mm pitch
  thumbs: 4
  number_row: false # status: fixed — numbers/symbols live on L1

matrix:
  columns: [outer, pinky, ring, middle, index, inner]
  rows: [top, home, bottom]
  splay: 0                  # status: fixed — parallel columns
  stagger:                  # status: provisional — mm offsets, outer sits low
    outer: -8
    pinky: 4
    ring: 5
    middle: 7
    index: -3
    inner: -6

thumbs:
  # Left west->east / right west->east. All standalone keys (status: fixed),
  # all 1u. The four sit on one true circle (R=90 about the thumb joint,
  # fitted residual 0.1mm): even ~13.2deg steps give even ~22mm chords and
  # clock-tangent rotations (tangent error <=1.6deg), so every key sits ON
  # the curve facing along it. Edge clearance >=1.3mm on every cap pair
  # (verified by polygon check, not center distance).
  left: [Ctrl, Cmd, L1, Space]
  right: [Enter, L2, Opt, Shift]
  notes:
    - Cmd is Super; Opt is Alt (status: fixed).
    - L1 and L2 stay separate layers (status: fixed).
    - Fn is the L1+L2 chord, not a key (status: provisional).
    - Tab is an L1+Space combo (status: provisional).
    - Cluster arcs down-east into the split gap; inner key most rotated.

encoder:
  per_side: 1 # status: provisional
  position: south of the inner column, clear of the MCU zone at top-inner
  # Knock-through belongs to the PLATE/CASE, not the PCB: the EC11E body sits
  # ON the board and all seven of its pads need copper (the A/B/C row is within
  # 7.9mm of the knob centre, i.e. inside an 8mm-radius hole).
  plate_cutout: 16mm circle at the encoder point, in the `plate` outline
  footprint: Ergogen stock `rotary` (EC11), attached in the PCB phase

mcu:
  keepout: 18x33 rect north of the encoder, in the gap (`_mcu` outline)
  part: nice!nano (Pro Micro footprint) # status: provisional
  orientation: >-
    USB-UP — the USB end points at the north board edge, which is open, so
    the plug seats in the `usb` notch. The module's USB shell does NOT
    overhang that edge (measured: shell x 113.5..122.5 vs board edge x=131.5,
    so it sits ~9mm inboard); the notch alone provides plug seating.
    Because the nice!nano v2 puts D1/RAW at the USB end, that means pads
    1 (D1) and 24 (RAW) face north and the ANTENNA end (pads 12/13) faces
    south, into the board. Antenna keepout is the `antenna_keepout` circle
    (r=5) at `antenna`, copper-free for 5mm past the module's south edge.
  status: fixed (placement); case clearance for the antenna is a CAD-phase
    cut — mark the keepout on the case too.
  battery: 301230 (3x12x30) sits UNDER the socketed module; the `batt`
    outline reserves its footprint. JST tail exits south to the `jst` point.

non-key anchors:  # PCB-phase mechanical envelope (status: fixed; see config)
  usb:    module USB-C centre at the north edge (opens the seat notch)
  antenna: module south (antenna) end — r=5 copper keepout
  batt:   301230 cell under the module (outline `_batt`, 12.5x31)
  jst:    JST-PH socket, south of the battery (`_jst`, 9x9 zone)
  pwrsw:  WS-SLTV slide switch on the north edge, west of the USB notch;
    outline `_pwrsw` (13x5), case slot over the actuator
  trrs: >-
    PJ-320A at the inner (gap-facing) edge, outline `_trrs` (17x7) centred
    on the `trrs` anchor. Measured on placed boards with J_L1 at
    (122.45,-22) rot 90 and J_R1 at (169.05,-22) rot 270 (CW-positive) —
    plastic mouths at L 134.55 and R 156.95 for 22.40mm mouth-to-mouth,
    each 0.99mm RECESSED behind its board edge (edges L 135.54 and R
    155.96 for 20.42mm edge-to-edge). Silk tops at 21.40mm, still 0.49mm
    recessed. Supersedes the stale 3.46mm-proud and 139.00 claim. The jack
    is THT with its pin row inboard and the barrel stays behind the edge.

split_width:
  mirror_distance: 4.5kx + 16
      # status: fixed — user-approved widening
    # Single line in `layout/ergogen/config.yaml` under `mirror:`.
    # Revert by deleting the "+ 16" — that restores the frozen baseline.
    # Snapshots of both widths: layout/- FINAL/keyboard_layout_v8.yaml
    # (4.5kx) and keyboard_layout_v8_exp_split.yaml (4.5kx + 16).
    # Left-half key geometry is bit-identical in both; only the right half
    # translates. Frozen v7 left-half key positions unchanged.
  inner_gap_at_encoder: 18.50mm between the two board edges  # status: measured
  inner_gap_at_trrs: >-
    20.42mm board-edge to board-edge at y=-22; plastic TRRS mouths at
    22.40mm mouth-to-mouth, each 0.99mm recessed (silk tops at 21.40mm,
    0.49mm recessed). 90-degree plugs need about 8mm of the 22.40mm gap
    and fit easily; a molded straight pair needs about 24mm and is
    marginal. Status measured.
    # PCB GATE — confirm the molded plug BOOTS (wider than the barrel)
    # also clear within 22.40mm. If they foul, use thinner boots or option (a).
  trrs_resolution: the +16mm widening RESOLVED the frozen-width problem — at
    4.5kx the mouths faced each other across ~4.4mm and no plug could seat.
    # The widening was chosen because it fixes TRRS without moving any key.
    # Superseded alternatives, if the widened gap ever becomes a problem:
    #   (a) both jacks on the OUTER edge, cable looping around the back,
    #   (b) one jack per half on the north edge above the MCU zone,
    #   (d) drop the wired split (BLE-only; TRRS is optional per
    #       spec/electronics.yaml architecture.split_link).
    # All of these change only the jack, never the key geometry.
  battery_antenna_overlap: the 301230 cell (`_batt`, y 16.5..47.5) sits over
    the antenna keepout circle (r=5 centred y=16.5) over y 16.5..21.5  # status: fixed — accepted, standard practice
    # RESOLVED 2026-10-13 by researching the reference builds. EVERY mainstream
    # wireless split puts the cell directly under the socketed nice!nano:
    #   Lily58 (typeractive build guide)  2x 301230 under the module; "you can't
    #     go much larger than 301230"
    #   Corne (crkbd#149, typeractive)     301230 under the module; needs a
    #     taller pin row (Mill-Max 335/800/350) for the 3mm cell
    #   Sofle v2.0w / SofleChocWireless / Aurora Sofle V2 — 110mAh slid under
    #     the controller; 4mm spring pins required, or lift the pins to make room
    #   splitkb Aurora series (Lily58/Corne/Sofle/Sweep/Helix): "80mAh or 110mAh
    #     ... can usually be placed between the PCB and the controller"
    #   nicekeyboards nice!nano docs: "in most cases the battery should fit
    #     underneath the socketed nice!nano"
    # NOT ONE of them applies an antenna keepout for the cell. Physically the
    # cell sits ABOVE this PCB and BELOW the module, so the r=5 COPPER keepout
    # on our board is honoured regardless — the two are independent layers.
    # Electrically a PCB trace antenna has a null perpendicular to its plane,
    # so a cell 3mm directly below the antenna end sits in that null rather
    # than shadowing the main lobe. Empirically it is not a practical problem.
    # IF range ever disappoints: 301228 (90mAh) is a drop-in shorter cell, and
    # the documented capacity upgrade is a 306080 between PCB and bottom plate
    # with 9mm standoffs (Sofle) — which also puts FR4 between antenna and cell.

screws:
  removed # no screws in the layout phase; revisit at CAD if plates need mounting

preview:
  outline: stacks board + keycaps + encoder holes + MCU rect + non-key zones
  use: ergogen.xyz Outlines tab, not the points demo

board:
  construction: concave hull per half (concavity 25) incl. MCU rect,
    expanded 4.5mm with rounded joints + fillet; encoder circles NOT cut
    (they live in `plate`) — the EC11E body rests on the PCB
  smoothing: helper point bridges the dip between thumb fan and outer
    columns so the contour runs gentle there
  note: plate truth moves to CadQuery in the CAD phase; this is a preview

relocated_keys:  # v1 -> v2 dispositions (status: fixed unless noted)
  Tab_1_5u: inner-bottom-left
  Cmd_1_5u: left thumb
  Shift_1_5u: right thumb
  quote_column: L1 layer
  Func_key: dropped  # superseded by the Fn chord
  blank_placeholders: dropped

keymap:
  # (column, row): left-hand legends; right hand mirrors per
  # layout/generators/export_kle.py MLAB. Inner-bottom Tab/Esc status: provisional.
  left:
    outer: [Q, A, Z]
    pinky: [W, S, X]
    ring: [E, D, C]
    middle: [R, F, V]
    index: [T, G, B]
    inner: ["~`", "{[_-", Tab]
  right:
    inner: ["|\\", "}]", Esc]
    index: [Y, H, N]
    middle: [U, J, M]
    ring: [I, K, "<"]
    pinky: [O, L, ">."]
    outer: [P, ":;0", "?/"]

open_points:
  - Left-hand Shift chords depend on the right-thumb Shift.
  - Backspace/Delete live on layers (unmapped so far): decide L1 positions.
  - Print-test at 1:1, then tag layout baseline in git.

# Hojicha44 ZMK bring-up config — DRAFT (pairs with hojicha44*.overlay).
# Verify with: west build -b nice_nano_v2 -- -DSHIELD=hojicha44_left
# (needs a zmk-config wrapper; this directory is the overlay/keymap source,
# not a complete Zephyr board definition).

# Encoder driver (alps,ec11) + its own trigger thread.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_OWN_THREAD=y

# Split: wired UART fallback over TRRS (BLE is the daily link).
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_WIRED=y

# USB HID + BLE, battery reporting via VDDH.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BATTERY_REPORTING=y

# NOTE: no CONFIG_NFCT_PINS_AS_GPIOS — removed in Zephyr 4.1. P0.09/P0.10
# as GPIO comes from `&uicr { nfct-pins-as-gpios; }` in hojicha44.dtsi,
# which needs a full chip erase to take effect. First flash MUST be
# `west flash --erase` (or nrfjprog --eraseall) or D10/ENC-push stay dead.

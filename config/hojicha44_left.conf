# Hojicha44 LEFT half (split central — role assigned in
# boards/shields/hojicha44/Kconfig.defconfig).

# The central carries the host links for the whole keyboard.
CONFIG_ZMK_USB=y

# Surface peripheral battery levels to the host: the central fetches each
# half's level (the nice_nano_v2 VDDH sense reports on both) and proxies
# them through an extra Battery Service entry, so the host shows both
# halves' batteries under one keyboard.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

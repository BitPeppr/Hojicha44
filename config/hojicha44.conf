# Hojicha44 ZMK user config — shared by BOTH halves (config dir conventions:
# <shield>.conf for every half, <shield>_left.conf / _right.conf per half).
# Built by CI (.github/workflows/build.yml) for hojicha44_left (central) and
# hojicha44_right on board nice_nano_v2. The split role itself is assigned
# in boards/shields/hojicha44/Kconfig.defconfig (left central, right
# peripheral) — upstream corne/sofle convention; CONFIG_ZMK_SPLIT also
# defaults y there, so it is not repeated here.

# Encoder driver (alps,ec11) + its own trigger thread.
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_OWN_THREAD=y

# BLE split; USB HID is central-only (see hojicha44_left.conf — on the
# peripheral CONFIG_ZMK_USB is unmet and would warn).
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BATTERY_REPORTING=y

# NFC pins as GPIO: `&uicr { nfct-pins-as-gpios; }` in hojicha44.dtsi
# writes the STICKY UICR option register (P0.09/P0.10 -> GPIO, D10 spare
# and ENC-push). UICR survives soft resets and is erased only by a full
# chip erase: the FIRST flash of a fresh board MUST be
# `west flash --erase` (or nrfjprog --eraseall) or those pins stay NFC.

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege on the caller: the reusable workflow's own steps use
# its implicit github.token for checkout/artifact upload (no secrets are
# referenced by build-user-config.yml@v0.3, so nothing to inherit).
permissions:
  contents: read

jobs:
  firmware_build:
    name: Build the ZMK firmware
    # Pinned to the v0.3 tag's commit (tags can move; review 2026-10-24).
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@edf5c0814fd3ea202e43aad2d68fd32e882a518c
    with:
      archive_name: hojicha44-firmwares

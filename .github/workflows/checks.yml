name: Static repo checks

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static_checks:
    name: Spec/gate static checks (no KiCad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: board_commit() and the release-currency gate
          # read git log -- <paths>; on a depth-1 checkout every path
          # "changes" at the tip commit and the manifest stamp fails
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm test
      - run: python3 pcb/make_release.py --check

  plate_gates:
    name: Plate geometry gates (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: board_commit() and the release-currency gate
          # read git log -- <paths>; on a depth-1 checkout every path
          # "changes" at the tip commit and the manifest stamp fails
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --check runs every build gate and writes nothing (outside the
      # W1/W2 footprint windows, which are vendored in-repo first)
      - run: python3 plate/gen_plate.py --check

  board_gates:
    name: PCB board gates (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: board_commit() and the release-currency gate
          # read git log -- <paths>; on a depth-1 checkout every path
          # "changes" at the tip commit and the manifest stamp fails
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # run against the COMMITTED boards — same gates as `npm test`'s
      # W1 python probe, without needing KiCad
      - run: python3 pcb/generators/check_board.py
      - run: python3 pcb/generators/audit_silk.py

  case_gates:
    name: Case geometry gates (CadQuery)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: board_commit() and the release-currency gate
          # read git log -- <paths>; on a depth-1 checkout every path
          # "changes" at the tip commit and the manifest stamp fails
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # pinned in case/requirements.txt; OCP wheels are big but cacheable
      - run: pip install -r case/requirements.txt
      - run: python3 case/gen_case.py
      # M6 (multi-model review): the ring cover was committed ungated —
      # its pad-press / single-solid / passage gates must run in CI too
      - run: python3 case/gen_cover.py
      # H-7 left/right mirror gate — was manual-only (MANUFACTURING);
      # the negative control (0.5mm Right translation) must still fail
      # whenever the gate is touched
      - run: python3 case/mirror_gate.py

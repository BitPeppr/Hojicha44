name: Static repo checks

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static_checks:
    name: Spec/gate static checks (no KiCad)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm test
      - run: python3 pcb/make_release.py --check

  plate_gates:
    name: Plate geometry gates (stdlib only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # --check runs every build gate and writes nothing (outside the
      # W1/W2 footprint windows, which are vendored in-repo first)
      - run: python3 plate/gen_plate.py --check

  case_gates:
    name: Case geometry gates (CadQuery)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # pinned in case/requirements.txt; OCP wheels are big but cacheable
      - run: pip install -r case/requirements.txt
      - run: python3 case/gen_case.py

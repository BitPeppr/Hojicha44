meta:
  engine: 4.2.1
  name: kbd-v2-curved-thumb
  version: 0.9.3

units:
  kx: u
  ky: u
  px: kx + 3
  py: ky + 3

points:
  zones:
    matrix:
      key:
        padding: 1ky
        spread: 1kx
        tags:
          - key
      anchor:
        shift: [0, 0]
      columns:
        outer:
          key:
            stagger: -8
        pinky:
          key:
            stagger: 4
        ring:
          key:
            stagger: 5
        middle:
          key:
            stagger: 7
        index:
          key:
            stagger: -3
        inner:
          key:
            stagger: -6
      rows:
        bottom:
        home:
        top:
    encoder:
      anchor:
        ref: matrix_inner_home
        shift: [23, -26]
      key:
        function: Enc
        tags:
          - key
          - encoder
    thumbs:
      key:
        padding: 1ky
        spread: 1kx
        tags:
          - key
      anchor:
        ref: matrix_middle_bottom
        shift: [0.6, -25.5]
      columns:
        t_ctrl:
          key:
            rotate: 0.5
            shift: [0, 0]
            function: Ctrl
            mirror:
              function: Shift
        t_cmd:
          key:
            rotate: -13.5
            shift: [2.7, -2.5]
            function: Cmd
            mirror:
              function: Opt
        t_l1:
          key:
            rotate: -27.5
            shift: [4.4, -10.2]
            function: L1
            mirror:
              function: L2
        t_space:
          key:
            rotate: -41.5
            shift: [4.6, -22.6]
            function: Space
            mirror:
              function: Enter
      rows:
        cluster:
    mcu:
      key:
        tags:
          - helper
        function: MCU
        width: 18.3
        height: 34.9
      anchor:
        ref: encoder
        shift: [0, 40]
    # --- non-key mechanical anchors (PCB phase; see spec/electronics.yaml) ---
    # USB-C port of the socketed module, placed USB-UP at the north edge so
    # the plug can seat in the notch cut below.
    usb:
      key:
        tags:
          - helper
      anchor:
        ref: mcu
        shift: [0, 17.95]
    # Antenna end = module SOUTH end (nice!nano v2 puts the antenna opposite
    # the USB end). 5mm copper-pour keepout, no case material within 3mm.
    antenna:
      key:
        tags:
          - helper
      anchor:
        ref: mcu
        shift: [0, -16.45]
    # 301230 cell (3x12x30 + PCM) sandwiched between the socketed module and
    # the PCB. (302030 is 20mm wide: wider than the 18mm module and it fouls
    # the socket pin rows, so it cannot go under a socketed nice!nano.)
    batt:
      key:
        tags:
          - helper
      anchor:
        ref: mcu
    # JST-PH 2.0mm socket, south of the battery; plug enters from the north.
    jst:
      key:
        tags:
          - helper
      anchor:
        ref: mcu
        shift: [0, -25]
    # WS-SLTV slide SPDT on the north edge, west of the USB notch; the case
    # needs a slot over the actuator (CAD phase).
    pwrsw:
      key:
        tags:
          - helper
      anchor:
        ref: matrix_inner_top
        shift: [9, 14]
    # PJ-320A TRRS at the inner edge, south of the encoder, plug facing the
    # split gap (east). `trrs` is the jack centre; the `_trrs` outline is 17mm
    # wide. Measured on placed boards (KiCad CW-positive rot; J_L1 at
    # (122.45,-22) rot 90, J_R1 at (169.05,-22) rot 270): plastic mouth faces
    # (local y=12.1 = rear -2 + 14.1 body) at L 134.55 / R 156.95 = 22.40mm
    # mouth-to-mouth; board edges at y=-22 are L 135.54 / R 155.96 = 20.42mm
    # edge-to-edge; each plastic mouth sits 0.99mm RECESSED behind (inboard
    # of) its edge — NOT protruding. Silk top (local y=12.6) sits 0.5mm proud
    # of the plastic: 21.40mm silk-to-silk, still 0.49mm recessed.
    # 90-degree right-angle cable REQUIRED (protrudes ~2-4mm, needs ~8mm of
    # the 22.40mm gap); molded straight plugs need ~24mm and are marginal.
    # See spec/electronics.yaml split_connector.plug_type for the full table.
    trrs:
      key:
        tags:
          - helper
      anchor:
        ref: matrix_inner_bottom
        shift: [35.5, -21]
  mirror:
    ref: matrix_inner_top
    # SPLIT WIDTH (the one line that re-spaces the whole right half — every
    # mirror_* point, both outlines and all downstream renders move together).
    # 4.5kx leaves only 2.5-4.4mm between the two board edges at the
    # encoder/TRRS height: a facing TRRS pair needs ~6mm of plug engagement
    # per side, so the jacks cannot both seat, and 2.5mm is a marginal fab web.
    # +16mm gives an 18.5mm worst-case inner gap. Left-half geometry is
    # untouched; only the right half translates. Revert by deleting the "+ 16".
    distance: 4.5kx + 16

outlines:
  board:
    - what: polygon
      points:
        - ref: matrix_outer_top
          shift: [-9.5, 9.5]
        - ref: matrix_ring_top
          shift: [-9.5, 9.5]
        - ref: matrix_middle_top
          shift: [-9.5, 9.5]
        - ref: matrix_middle_top
          shift: [9.5, 9.5]
        - ref: matrix_index_top
          shift: [9.5, 9.5]
        # power-switch body, so the case slot over the actuator stays on-board
        - ref: pwrsw
          shift: [-6.5, 2.5]
        - ref: pwrsw
          shift: [6.5, 2.5]
        - ref: matrix_inner_top
          shift: [9.5, 9.5]
        - ref: mcu
          shift: [9.15, 17.45]
        - ref: mcu
          shift: [9.15, -17.45]
        - ref: encoder
          shift: [14.0, 0.0]
        - ref: thumbs_t_space_cluster
          shift: [12.7, 0.78]
        - ref: thumbs_t_space_cluster
          shift: [0.78, -12.7]
        - ref: thumbs_t_ctrl_cluster
          shift: [-8.92, -9.08]
        - ref: matrix_outer_bottom
          shift: [9.5, -9.5]
        - ref: matrix_outer_bottom
          shift: [-9.5, -9.5]
    - what: polygon
      expand: 4.5
      fillet: 2
      points:
        - ref: mirror_matrix_outer_top
          shift: [-9.5, 9.5]
        - ref: mirror_matrix_ring_top
          shift: [-9.5, 9.5]
        - ref: mirror_matrix_middle_top
          shift: [-9.5, 9.5]
        - ref: mirror_matrix_middle_top
          shift: [9.5, 9.5]
        - ref: mirror_matrix_index_top
          shift: [9.5, 9.5]
        - ref: mirror_pwrsw
          shift: [6.5, 2.5]
        - ref: mirror_pwrsw
          shift: [-6.5, 2.5]
        - ref: mirror_matrix_inner_top
          shift: [9.5, 9.5]
        - ref: mirror_mcu
          shift: [9.15, 17.45]
        - ref: mirror_mcu
          shift: [9.15, -17.45]
        - ref: mirror_encoder
          shift: [14.0, 0.0]
        - ref: mirror_thumbs_t_space_cluster
          shift: [12.7, 0.78]
        - ref: mirror_thumbs_t_space_cluster
          shift: [0.78, -12.7]
        - ref: mirror_thumbs_t_ctrl_cluster
          shift: [-8.92, -9.08]
        - ref: mirror_matrix_outer_bottom
          shift: [9.5, -9.5]
        - ref: mirror_matrix_outer_bottom
          shift: [-9.5, -9.5]
    # USB-C seat notch: the mid-mount port sits at the module's end face, so
    # the board edge must be cut back there or the plug cannot seat. Clears
    # the topmost socket pads (pad 1/13 top edge ~47.0mm) by ~0.5mm.
    # Open to the north edge: top 58.05 clears the expanded edge (57.5 at x=112.5,
    # 54.0 at x=115, 52.7 at x=117). Bottom 47.25 stays >=0.5 mm above the top
    # socket pad copper (pad 1/24 centre mcu+13.47, r~0.85). See fix.md P0-1.
    - operation: subtract
      what: rectangle
      where: [usb, mirror_usb]
      size: [11, 10.8]
      adjust:
        shift: [0, 2.7]
    # NOTE: `expand`/`fillet` below are hoisted by Ergogen to every item in
    # this group, so both halves come out identically expanded/filleted.
  # The encoder knock-through belongs to the plate/case, NOT the PCB: the
  # EC11E body sits ON the PCB and all seven of its pads need copper (the
  # A/B/C row sits within 7.9mm of the knob centre, i.e. inside an
  # 8mm-radius hole). Kept in `plate` below for reference/CAD.
  plate:
    - what: outline
      name: board
      operation: stack
    - operation: subtract
      what: circle
      where: [encoder, mirror_encoder]
      radius: 8
  demo:
    - what: rectangle
      where: [key]
      size: [kx - 1, ky - 1]
  _keycaps:
    - what: rectangle
      where: [key]
      size: 18
      fillet: 3
  _mcu:
    - what: rectangle
      where: [mcu, mirror_mcu]
      size: [18.3, 34.9]
      fillet: 1
    - what: rectangle
      where: [mcu, mirror_mcu]
      size: [8.94, 7.35]
      operation: stack
      fillet: 0.1
      adjust:
        shift: [0, 34.9/2 - 7.35/2 + 0.7]
  encoder_holes:
    - what: circle
      where: [encoder, mirror_encoder]
      radius: 8
  # --- non-key part zones (reference for CAD/PCB; not part of the board) ---
  _batt:
    - what: rectangle
      where: [batt, mirror_batt]
      size: [12.5, 31]
      fillet: 1
  _jst:
    - what: rectangle
      where: [jst, mirror_jst]
      size: [9, 9]
      fillet: 0.5
  _pwrsw:
    - what: rectangle
      where: [pwrsw, mirror_pwrsw]
      size: [13, 5]
      fillet: 0.5
  _trrs:
    - what: rectangle
      where: [trrs, mirror_trrs]
      size: [17, 7]
      fillet: 0.5
  _usb:
    - what: rectangle
      where: [usb, mirror_usb]
      size: [11, 10.8]
      adjust:
        shift: [0, 2.7]
  antenna_keepout:
    - what: circle
      where: [antenna, mirror_antenna]
      radius: 5
  preview:
    - what: outline
      name: board
    - what: outline
      name: _keycaps
      operation: stack
    - what: outline
      name: encoder_holes
      operation: stack
    - what: outline
      name: _mcu
      operation: stack
    - what: outline
      name: _batt
      operation: stack
    - what: outline
      name: _jst
      operation: stack
    - what: outline
      name: _pwrsw
      operation: stack
    - what: outline
      name: _trrs
      operation: stack
    - what: outline
      name: _usb
      operation: stack
    - what: outline
      name: antenna_keepout
      operation: stack
